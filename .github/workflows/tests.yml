name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ats-monitor
      # The Monitor's multi-server transport is supplied by ATS, so its suite runs against the ATS main branch.
      - uses: actions/checkout@v4
        with:
          repository: abinaavk/ats
          path: ats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: ats-monitor
        run: python -m pip install -r requirements.txt pyyaml prometheus_client requests websocket-client
      - name: Every module compiles
        working-directory: ats-monitor
        run: python -m compileall -q .
      - name: Unit tests
        working-directory: ats-monitor
        run: >
          sudo -E env "PATH=$PATH"
          "ATS_MODULE_DIR=$GITHUB_WORKSPACE/ats"
          "PYTHONPATH=.:$GITHUB_WORKSPACE/ats:tests"
          python -m unittest discover -s tests -p "test_*.py"
