<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'jetblack');</script>
<link rel="stylesheet" href="/static/css/style.css">
<title>ATS Monitor</title>
<style>
.login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
}
.login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 3rem 2.5rem;
    text-align: center; max-width: 380px; width: 100%;
    box-shadow: var(--sh-card);
    animation: reveal 0.5s var(--ease) forwards;
}
@keyframes reveal { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
.login-title {
    font-family: 'Funnel Display', Georgia, serif;
    font-size: 1.5rem; font-weight: 400;
    letter-spacing: -0.02em; color: var(--text-1);
    margin-bottom: 0.5rem;
}
.login-sub {
    font-size: 0.8125rem; color: var(--text-3); margin-bottom: 2rem;
}
.login-input {
    width: 100%; background: var(--bg-warm); border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--text-1);
    font-family: inherit; font-size: 0.9375rem;
    padding: 12px 18px; outline: none; text-align: center;
    transition: all 0.3s var(--ease); margin-bottom: 1rem;
    letter-spacing: 0.15em;
}
.login-input::placeholder { color: var(--text-4); letter-spacing: normal; }
.login-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.login-btn {
    width: 100%; background: var(--accent); color: var(--bg);
    border: none; border-radius: var(--r-pill);
    font-family: inherit; font-size: 0.875rem; font-weight: 700;
    padding: 12px; cursor: pointer; transition: all 0.3s var(--ease);
}
.login-btn:hover { transform: scale(1.02); opacity: 0.9; }
.login-btn:active { transform: scale(0.98); }
.login-error {
    color: var(--badge-max); font-size: 0.75rem; font-weight: 600;
    margin-top: 0.75rem; animation: shake 0.4s ease;
}
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-title">ATS Monitor</div>
        <div class="login-sub">Enter password to continue</div>
        <form method="POST" action="/login">
            <input type="password" name="password" class="login-input" placeholder="Password" autofocus required>
            <button type="submit" class="login-btn">Enter</button>
        </form>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    </div>
</div>
</body>
</html>
